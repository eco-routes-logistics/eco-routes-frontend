<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#167D4A" />
  <title>EcoRoutes - Logistics Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Only the axes we use (opsz 24, wght 400, GRAD 0, FILL 0..1): a fraction of the full variable font -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
    rel="stylesheet" />
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash
    if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
  </script>
  <style>
    /* Initial page loader (shown until React paints) */
    #initial-loader {
      position: fixed;
      inset: 0;
      background: #F4F6F5;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .dark #initial-loader {
      background: #0E1311;
    }
    #initial-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #initial-loader-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #DCE2DF;
      border-top-color: #167D4A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { rotate: 1turn; } }
  </style>
</head>

<body>
  <div id="initial-loader"><div id="initial-loader-spinner"></div></div>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  <script>
    // Hide loader once React has painted AND the fonts it uses have loaded,
    // so nobody sees the layout before icons/text settle. Capped at 3s on slow networks.
    const hideLoader = () => {
      const loader = document.getElementById('initial-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 300);
      }
    };
    const observer = new MutationObserver(() => {
      if (document.getElementById('root').children.length > 0) {
        observer.disconnect();
        // Wait a frame so the fonts used by the first render have started loading
        requestAnimationFrame(() => {
          const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
          Promise.race([fontsReady, new Promise((r) => setTimeout(r, 3000))]).then(hideLoader);
        });
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>

</html>
