<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EcoRoutes - Logistics Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#135bec',
            'primary-dark': '#0e45b5',
            'background-light': '#f6f6f8',
            'background-dark': '#101622',
            'card-dark': '#1a2230',
            'surface-dark': '#1a202c',
            'rejected': '#dc2626',
            'whatsapp': '#25D366'
          },
          fontFamily: {
            display: ['Inter', 'Public Sans', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      font-size: inherit;
    }

    /* Hide icon text until font loads to prevent FOUC */
    .material-symbols-outlined:not(.loaded) {
      color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Initial page loader */
    #initial-loader {
      position: fixed;
      inset: 0;
      background: #f7f8fa;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .dark #initial-loader {
      background: #0d0f14;
    }
    #initial-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #initial-loader-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #135bec;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { rotate: 1turn; } }

    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #374151;
    }

    @media print {
      .no-print {
        display: none !important;
      }

      body {
        background: white !important;
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>

<body class="bg-background-light dark:bg-background-dark text-[#111318] dark:text-white font-display antialiased">
  <div id="initial-loader"><div id="initial-loader-spinner"></div></div>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  <script>
    // Hide loader once React has painted
    const observer = new MutationObserver(() => {
      if (document.getElementById('root').children.length > 0) {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 300);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>

</html>
